# 推送到 release 分支时：装依赖 → 测试 → 构建 → 发布到 npm → 打 tag + 建 GitHub Release
#
# 发布成功之后才打 tag。构建或发布失败时不会在仓库里留下指向「未发布提交」的标签，
# 重跑也不会因为 tag 已存在而卡死。
#
# 认证走 **npm Trusted Publishing（OIDC）**，不存任何长期 token。
# 在 npmjs.com 的包设置里要有一条对应的 Trusted Publisher 记录，三项必须与这里一致：
#     Repository       = wflixu/Today-UI
#     Workflow filename= npm-publish.yml
#     Environment name = 留空（本 job 没有声明 environment:）
# 之所以不用 token：npm 已在 2026-08 收紧 bypass-2FA token 的账号管理能力，
# 并计划在 2027-01 取消其直接发布能力，长期 token 这条路正在被关闭。

name: npm package publish

on:
  push:
    branches:
      - release

# 两次推送不要同时发版：后一次排队等待，而不是取消前一次（避免发出半个版本）
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    # 闸门：只有标题带 chore(release) 的提交才会真正发布，
    # 往 release 推普通提交不会误发。
    #
    # 判断的是本次推送的**最后一个**提交（head_commit），所以从 main 合并过来时，
    # 要让那个合并提交自己带标题：
    #     git merge main --no-ff -m "chore(release): 0.3.0"
    # 先 merge 再补一个 bump 提交也可以，只要最后那个提交带标题。
    if: contains(github.event.head_commit.message, 'chore(release)')

    permissions:
      contents: write # 推送 tag、创建 Release
      id-token: write # Trusted Publishing：让 npm 校验这次发布确实来自本仓库
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          # 刻意不设 registry-url：它会写一个引用 NODE_AUTH_TOKEN 的 .npmrc，
          # 而 OIDC 下这个变量不存在，一个空 token 会被当成凭据发出去而报 404。
          # today-ui 是无作用域包，默认 registry 就是 npmjs.org，不需要显式指定。

      - name: Read version
        id: version
        run: |
          node -p "'value=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      # 提前失败：忘记升版本号是最常见的失误，不该等装完依赖、跑完测试才发现
      - name: Fail fast if version already published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "today-ui@$VERSION" version >/dev/null 2>&1; then
            echo "::error::today-ui@$VERSION 已存在于 npm"
            echo "  忘了升版本号 → 改 package.json 的 version 后重新推送"
            echo "  上次发布成功但打 tag 失败 → 手动执行：git tag v$VERSION && git push origin v$VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Trusted Publishing 要求 npm ≥ 11.5.2，Node 自带的版本未必够，显式升一次
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.2

      # 不再需要 NPM_TOKEN：npm 用 GitHub 签发的 OIDC 令牌校验这次发布来自本仓库
      - name: Publish to npm
        run: npm publish

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.version.outputs.value }}
        run: |
          # 幂等：重跑时 tag / Release 可能已经存在，不应因此失败
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "$VERSION" --generate-notes
